services:
  v380-decoder:
    image: v380decoder:latest  # Tells Portainer to use your locally built image
    container_name: v380decoder
    ports:
      - "8555:8554"  # RTSP video stream
      - "8001:8000"  # ONVIF PTZ control port
      - "8081:8080"  # Expose the Web UI on host port 8081 # --ip 192.168.100.214
    command: [
      "--id", "82697509",
      "--username", "82697509",
      "--password", "Okai1994",
      "--ip", "192.168.100.214",
      "--output", "rtsp",          # <--- Explicitly forces full audio/video initialization
      "--enable-onvif",
      "--enable-api",
      "--quality", "sd",
      "--debug"
    ]
    restart: always
    
  frigate:
    container_name: frigate
    privileged: true
    restart: unless-stopped
    image: ghcr.io/blakeblackshear/frigate:stable
    shm_size: "512mb" # Increase if you have multiple 4K/2K cameras
    network_mode: host
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128 # Passes the iGPU into the Docker container
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /mnt/Docker/volumes/frigate/config:/config
      - /mnt/Media/Frigate:/media/frigate
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 1000000000
    environment:
      FRIGATE_RTSP_PASSWORD: "Oka!1994"
      
  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    user: 1000:1000 
    network_mode: host
    restart: unless-stopped
    volumes:
      - /mnt/Docker/volumes/jellyfin/config:/config
      - /mnt/Docker/volumes/jellyfin/cache:/cache
      - /mnt/Docker/volumes/jellyfin/data:/var/lib/jellyfin
      - /mnt/Docker/volumes/jellyfin/log:/log
      - /mnt/Media:/mnt/Media 
    devices:
      - /dev/dri:/dev/dri
      
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    network_mode: host
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Africa/Accra
      - VERSION=docker
      - PLEX_CLAIM=claim-kXX6apZ4PnEk9zVdo9a6
    volumes:
      - /mnt/Code/DOCKER/volumes/plex/config:/config
      - /mnt/Media:/shared
    devices:
      - /dev/dri:/dev/dri # Passes through the entire iGPU directory
    restart: unless-stopped
